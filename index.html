<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Svenska">
<meta name="theme-color" content="#1a1a2e">
<title>Svenska</title>
<style>
:root{
  --bg:#0f0f1a;--sur:#1a1a2e;--sur2:#22223a;--bdr:#2e2e4a;
  --txt:#f0eef8;--txt2:#a09cc0;--txt3:#6a6888;
  --acc:#7c6fe0;--acc2:#a594f9;
  --grn:#34c988;--red:#e07060;--gold:#f0b429;--blu:#4a9fd4;--pod:#52b788;
  --rad:12px;--rad2:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}

/* layout */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{padding:52px 16px 10px;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:20px;font-weight:700}
.header h1 span{color:var(--acc2)}
.hstats{display:flex;gap:8px}
.chip{font-size:11px;background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:3px 10px;color:var(--txt2)}
.chip b{color:var(--txt)}
.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0}
.tab{flex:1;padding:11px 4px;font-size:13px;font-weight:600;color:var(--txt3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--acc2);border-bottom-color:var(--acc2)}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.on{display:flex}

/* filters & search */
.search-bar{padding:10px 14px 6px;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0}
.search-bar input{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:9px 14px;font-size:15px;color:var(--txt);outline:none}
.search-bar input::placeholder{color:var(--txt3)}
.fscroll{display:flex;gap:7px;overflow-x:auto;padding:8px 14px 10px;background:var(--sur);border-bottom:1px solid var(--bdr);scrollbar-width:none;flex-shrink:0}
.fscroll::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;font-size:12px;font-weight:600;padding:5px 13px;border-radius:20px;border:1.5px solid var(--bdr);color:var(--txt2);background:transparent;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill.pr{background:var(--red);border-color:var(--red);color:#fff}
.pill.nw{background:var(--grn);border-color:var(--grn);color:#000}
.pill.ba{background:var(--blu);border-color:var(--blu);color:#fff}
.pill.po{background:var(--pod);border-color:var(--pod);color:#fff}
.srow{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;background:var(--sur);border-bottom:1px solid var(--bdr);font-size:12px;color:var(--txt2);flex-shrink:0}
.spd{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1.5px solid var(--bdr);color:var(--txt2);background:transparent;cursor:pointer}
.spd.on{border-color:var(--acc2);color:var(--acc2)}
#vlabel{font-size:11px;color:var(--txt3);margin-left:4px}

/* list */
.list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lshow{font-size:11px;color:var(--txt3);padding:8px 14px 4px}
.card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bdr)}
.card.pr{border-left:3px solid var(--red)}
.card.nw{border-left:3px solid var(--grn)}
.cbody{flex:1;min-width:0}
.csv{font-size:16px;font-weight:600;color:var(--txt);line-height:1.3}
.cpron{font-size:12px;color:var(--acc2);font-style:italic;margin-top:2px}
.cen{font-size:13px;color:var(--txt2);margin-top:3px}
.forms-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.form-chip{font-size:10px;background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:2px 8px;color:var(--txt3)}
.form-chip b{color:var(--acc2)}
.cmeta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.stag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.sbabbel{background:rgba(74,159,212,.15);color:var(--blu)}
.spodcast{background:rgba(82,183,136,.15);color:var(--pod)}
.ctag{font-size:10px;color:var(--txt3)}
.bdg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.bdg-pr{background:rgba(224,112,96,.15);color:var(--red)}
.bdg-nw{background:rgba(52,201,136,.15);color:var(--grn)}
.spkbtn{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--txt2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.spkbtn.playing{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{padding:60px 24px;text-align:center;color:var(--txt3);font-size:15px}

/* ── ADD SCREEN ── */
.add-wrap{flex:1;overflow-y:auto;padding:16px}
.add-section{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad);padding:16px;margin-bottom:14px}
.add-section h3{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.add-row{margin-bottom:12px}
.add-row label{font-size:12px;color:var(--txt3);display:block;margin-bottom:5px}
.add-row input,.add-row select,.add-row textarea{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:10px 12px;font-size:14px;color:var(--txt);outline:none;font-family:inherit}
.add-row textarea{min-height:70px;resize:none}
.add-row select option{background:var(--sur)}
.add-btn{width:100%;padding:14px;border-radius:var(--rad2);border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;margin-top:4px}
.add-btn:active{opacity:.8}
.ai-btn{width:100%;padding:12px;border-radius:var(--rad2);border:1.5px solid var(--acc);font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(--acc2);margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.ai-btn:active{opacity:.8}
.ai-result{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:12px;margin-top:10px;font-size:13px;color:var(--txt2);min-height:60px;white-space:pre-wrap;display:none}
.ai-result.show{display:block}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bdr);border-top-color:var(--acc2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.form-preview{background:var(--sur2);border:1px solid var(--acc);border-radius:var(--rad2);padding:12px;margin-top:10px;display:none}
.form-preview.show{display:block}
.fp-sv{font-size:18px;font-weight:700;color:var(--txt)}
.fp-pron{font-size:12px;color:var(--acc2);font-style:italic;margin-top:2px}
.fp-en{font-size:13px;color:var(--txt2);margin-top:4px}
.fp-forms{margin-top:8px;font-size:12px;color:var(--txt3)}
.custom-tag{display:inline-block;font-size:10px;background:rgba(124,111,224,.2);color:var(--acc2);border-radius:20px;padding:2px 8px;margin-left:4px}

/* ── FLASHCARD QUIZ ── */
.quiz-wrap{flex:1;overflow-y:auto;padding:16px 16px 100px}
.qmode-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.qmode{font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;border:1.5px solid var(--bdr);color:var(--txt2);background:transparent;cursor:pointer}
.qmode.on{background:var(--acc);border-color:var(--acc);color:#fff}
.qprog{display:flex;gap:3px;margin-bottom:16px}
.qpip{flex:1;height:4px;border-radius:2px;background:var(--bdr)}
.qpip.done{background:var(--grn)}
.qpip.cur{background:var(--acc2)}
.qstats{display:flex;gap:8px;margin-bottom:14px}
.qstat{flex:1;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad2);padding:10px;text-align:center}
.qstat-n{font-size:22px;font-weight:700}
.qstat-l{font-size:11px;color:var(--txt3);margin-top:2px}

/* flashcard */
.flashcard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad);padding:28px 20px;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
.flashcard:active{transform:scale(.98)}
.fc-hint{font-size:11px;color:var(--txt3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.fc-q{font-size:26px;font-weight:700;color:var(--txt);line-height:1.3;margin-bottom:8px}
.fc-sub{font-size:13px;color:var(--txt3)}
.fc-reveal{display:none;width:100%;border-top:1px solid var(--bdr);margin-top:16px;padding-top:16px}
.fc-reveal.show{display:block}
.fc-ans{font-size:20px;font-weight:600;color:var(--grn);margin-bottom:6px}
.fc-pron{font-size:13px;color:var(--acc2);font-style:italic;margin-bottom:6px}
.fc-forms-fc{font-size:12px;color:var(--txt3);margin-top:6px}
.tap-hint{font-size:12px;color:var(--txt3);margin-top:12px}
.fc-actions{display:flex;gap:10px;margin-top:4px}
.fc-btn{flex:1;padding:16px;border-radius:var(--rad2);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .1s}
.fc-btn:active{opacity:.7}
.fc-no{background:rgba(224,112,96,.2);color:var(--red)}
.fc-yes{background:rgba(52,201,136,.2);color:var(--grn)}
.fc-skip{background:var(--sur2);color:var(--txt2);border:1px solid var(--bdr)!important;flex:0 0 auto;padding:16px 18px}
.qscore-screen{text-align:center;padding:40px 20px}
.qscore-n{font-size:72px;font-weight:800;color:var(--acc2);line-height:1}
.qscore-l{font-size:17px;color:var(--txt2);margin-top:10px}
.qscore-s{font-size:13px;color:var(--txt3);margin-top:4px}
.qrestart{margin-top:28px;background:var(--acc);color:#fff;padding:14px 32px;border-radius:var(--rad2);font-size:16px;font-weight:700;cursor:pointer;border:none}
/* bottom nav */
.bnav{display:flex;background:var(--sur);border-top:1px solid var(--bdr);padding:8px 0 calc(8px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:0;right:0;z-index:20}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;cursor:pointer;color:var(--txt3);font-size:10px;font-weight:600}
.nbtn.on{color:var(--acc2)}
.nicon{font-size:22px}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <h1>🇸🇪 <span>Svenska</span></h1>
  <div class="hstats">
    <div class="chip"><b id="sn-total">249</b> words</div>
    <div class="chip" style="color:var(--red)"><b id="sn-pr">0</b> review</div>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="showScreen('browse',this)">Browse</button>
  <button class="tab" onclick="showScreen('quiz',this)">Flashcards</button>
  <button class="tab" onclick="showScreen('add',this)">+ Add</button>
</div>

<!-- ── BROWSE ── -->
<div id="screen-browse" class="screen on">
  <div class="search-bar"><input type="search" placeholder="Search Swedish or English..." oninput="doSearch(this.value)" id="search-in"></div>
  <div class="fscroll" id="src-row">
    <button class="pill ba" onclick="setSrc('all',this)">All sources</button>
    <button class="pill" onclick="setSrc('Babbel',this)" style="--c:var(--blu)">Babbel</button>
    <button class="pill" onclick="setSrc('Podcast',this)" style="--c:var(--pod)">Podcast PDF</button>
    <button class="pill" onclick="setSrc('Custom',this)">My words</button>
  </div>
  <div class="fscroll" id="cat-row">
    <button class="pill on" onclick="setCat('all',this)">All</button>
    <button class="pill pr" onclick="setCat('priority',this)">Review</button>
    <button class="pill nw" onclick="setCat('new',this)">New</button>
    <button class="pill" onclick="setCat('Greetings',this)">Greetings</button>
    <button class="pill" onclick="setCat('Family',this)">Family</button>
    <button class="pill" onclick="setCat('People',this)">People</button>
    <button class="pill" onclick="setCat('Daily life',this)">Daily life</button>
    <button class="pill" onclick="setCat('Weather',this)">Weather</button>
    <button class="pill" onclick="setCat('Restaurant',this)">Restaurant</button>
    <button class="pill" onclick="setCat('Questions',this)">Questions</button>
    <button class="pill" onclick="setCat('Directions',this)">Directions</button>
    <button class="pill" onclick="setCat('Transport',this)">Transport</button>
    <button class="pill" onclick="setCat('Social',this)">Social</button>
    <button class="pill" onclick="setCat('Pronouns',this)">Pronouns</button>
    <button class="pill" onclick="setCat('Pronunciation',this)">Pronunciation</button>
  </div>
  <div class="fscroll" id="type-row">
    <button class="pill on" onclick="setType('all',this)">All types</button>
    <button class="pill" onclick="setType('word',this)">Words &amp; phrases</button>
    <button class="pill" onclick="setType('sentence',this)">Sentences</button>
  </div>
  <div class="srow">🔊 Speed:
    <button class="spd" onclick="setSpd(0.6,this)">Slow</button>
    <button class="spd on" onclick="setSpd(0.85,this)">Normal</button>
    <button class="spd" onclick="setSpd(1.1,this)">Fast</button>
    <span id="vlabel">loading voice…</span>
  </div>
  <div class="list-wrap">
    <div class="lshow" id="lshow"></div>
    <div id="vlist"></div>
  </div>
</div>

<!-- ── FLASHCARD QUIZ ── -->
<div id="screen-quiz" class="screen">
  <div class="quiz-wrap" id="quiz-wrap">
    <div class="qmode-row">
      <button class="qmode on" onclick="setQMode('all',this)">All words</button>
      <button class="qmode" onclick="setQMode('priority',this)">Review only</button>
      <button class="qmode" onclick="setQMode('new',this)">New only</button>
      <button class="qmode" onclick="setQMode('custom',this)">My words</button>
    </div>
    <div id="qcontent"></div>
  </div>
</div>

<!-- ── ADD VOCAB ── -->
<div id="screen-add" class="screen">
  <div class="add-wrap">

    <div class="add-section">
      <h3>🔑 Gemini API key</h3>
      <div class="add-row">
        <label>Paste your Google Gemini API key (saved to this device only)</label>
        <input type="password" id="gemini-key-input" placeholder="AIza..." autocorrect="off" autocapitalize="off" autocomplete="off">
      </div>
      <div style="display:flex;gap:8px">
        <button class="add-btn" onclick="saveGeminiKey()" style="background:var(--sur2);border:1.5px solid var(--acc);color:var(--acc2)">Save key</button>
        <button class="add-btn" onclick="clearGeminiKey()" style="background:var(--sur2);border:1.5px solid var(--bdr);color:var(--txt3)">Clear</button>
      </div>
      <div id="key-status" style="font-size:12px;color:var(--txt3);margin-top:8px">No key saved yet.</div>
      <p style="font-size:11px;color:var(--txt3);margin-top:8px">Get a free key at <strong>aistudio.google.com</strong> → Get API key. Key stays on your device only.</p>
    </div>

    <div class="add-section">
      <h3>✨ Smart expand</h3>
      <div class="add-row">
        <label>Enter any Swedish word or sentence</label>
        <input type="text" id="ai-input" placeholder="e.g. att äta, äpplet, jag går…" autocorrect="off" autocapitalize="off">
      </div>
      <button class="ai-btn" onclick="doExpand()">
        <span id="ai-spin" style="display:none" class="spinner"></span>
        <span id="ai-label">Expand &amp; generate forms</span>
      </button>
      <div class="ai-result" id="ai-result"></div>
      <div class="form-preview" id="form-preview">
        <div class="fp-sv" id="fp-sv"></div>
        <div class="fp-pron" id="fp-pron"></div>
        <div class="fp-en" id="fp-en"></div>
        <div class="fp-forms" id="fp-forms"></div>
      </div>
      <button class="add-btn" id="save-expanded-btn" style="display:none;margin-top:12px" onclick="saveExpanded()">Add to my vocab</button>
    </div>

    <div class="add-section">
      <h3>Manual add</h3>
      <div class="add-row"><label>Swedish word / phrase</label><input type="text" id="m-sv" placeholder="e.g. en hund" autocorrect="off" autocapitalize="off"></div>
      <div class="add-row"><label>Pronunciation guide</label><input type="text" id="m-pron" placeholder="e.g. en hoond" autocorrect="off" autocapitalize="off"></div>
      <div class="add-row"><label>English meaning</label><input type="text" id="m-en" placeholder="e.g. a dog"></div>
      <div class="add-row"><label>Extra forms (optional)</label><textarea id="m-forms" placeholder="e.g. plural: hundar · definite: hunden · past: åt"></textarea></div>
      <div class="add-row"><label>Category</label>
        <select id="m-cat">
          <option>Greetings</option><option>Family</option><option>People</option>
          <option>Daily life</option><option>Weather</option><option>Restaurant</option>
          <option>Questions</option><option>Directions</option><option>Transport</option>
          <option selected>Social</option><option>Pronouns</option><option>Pronunciation</option>
        </select>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:12px;align-items:center">
        <label style="font-size:12px;color:var(--txt3)">Mark as review:</label>
        <input type="checkbox" id="m-pr" style="width:20px;height:20px;cursor:pointer">
      </div>
      <button class="add-btn" onclick="manualAdd()">Add word</button>
    </div>

    <div class="add-section" id="custom-list-section" style="display:none">
      <h3>My added words (<span id="custom-count">0</span>)</h3>
      <div id="custom-list"></div>
    </div>

  </div>
</div>

</div><!-- end .app -->

<nav class="bnav">
  <button class="nbtn on" id="nav-browse" onclick="showScreen('browse',this)"><span class="nicon">📚</span>Browse</button>
  <button class="nbtn" id="nav-quiz" onclick="showScreen('quiz',this)"><span class="nicon">🃏</span>Flashcards</button>
  <button class="nbtn" id="nav-add" onclick="showScreen('add',this)"><span class="nicon">➕</span>Add</button>
</nav>

<script>
const VOCAB=[
  {sv:'Gott!',pron:'yot',en:'Good! / Tasty!',src:'Babbel',cat:'Greetings',p:0,n:0,t:'word',forms:''},

  {sv:'Jag dricker hellre en juice',pron:'yag DRIK-er HEL-reh en joos',en:'I\'d rather drink a juice',src:'Babbel',cat:'Restaurant',p:0,n:0,t:'sentence',forms:''},

  {sv:'Smörgåsen dröjer lite',pron:'SMUR-gaw-sen DRUR-yer LEE-teh',en:'The sandwich will be a moment',src:'Babbel',cat:'Restaurant',p:0,n:0,t:'word',forms:''},

  {sv:'Vet du vad?',pron:'veht doo vah',en:'You know what?',src:'Babbel',cat:'Greetings',p:0,n:0,t:'word',forms:''},
  {sv:'Hur kommer jag dit?',pron:'hoor KOM-er yag deet',en:'How do I get there?',src:'Babbel',cat:'Directions',p:0,n:0,t:'sentence',forms:''},
  {sv:'Kan ni rekommendera en restaurang?',pron:'kan nee reh-kom-en-DEH-ra en res-taw-RANG',en:'Can you recommend a restaurant?',src:'Babbel',cat:'Restaurant',p:0,n:0,t:'sentence',forms:''},
  {sv:'I närheten av',pron:'ee NEHR-heh-ten av',en:'Near / in the vicinity of',src:'Babbel',cat:'Directions',p:0,n:0,t:'word',forms:''},

<script>
// ── CUSTOM VOCAB (localStorage) ──
function loadCustom(){
  try{ return JSON.parse(localStorage.getItem('sv_custom')||'[]'); }catch(e){return [];}
}
function saveCustom(arr){ localStorage.setItem('sv_custom',JSON.stringify(arr)); }
let CUSTOM = loadCustom();

function allVocab(){ return [...VOCAB, ...CUSTOM.map(c=>({...c,src:'Custom',n:0}))]; }

// ── VOICE ──
let svVoice=null, spRate=0.85, curBtn=null;
function loadVoice(){
  const vv=window.speechSynthesis.getVoices();
  svVoice=vv.find(v=>v.lang.startsWith('sv'))||null;
  document.getElementById('vlabel').textContent=svVoice?'('+svVoice.name+')':'(no sv voice — use Chrome)';
}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoice;loadVoice();}
function speak(text,btn){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  if(curBtn&&curBtn!==btn){curBtn.classList.remove('playing');curBtn.textContent='🔊';}
  const u=new SpeechSynthesisUtterance(text);
  if(svVoice)u.voice=svVoice;
  u.lang='sv-SE';u.rate=spRate;
  btn.classList.add('playing');btn.textContent='⏸';curBtn=btn;
  u.onend=()=>{btn.classList.remove('playing');btn.textContent='🔊';curBtn=null;};
  window.speechSynthesis.speak(u);
}
function setSpd(r,btn){spRate=r;document.querySelectorAll('.spd').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

// ── BROWSE STATE ──
let catF='all',srcF='all',typeF='all',searchQ='';
function filtered(){
  let items=allVocab();
  if(catF==='priority') items=items.filter(v=>v.p);
  else if(catF==='new') items=items.filter(v=>v.n);
  else if(catF!=='all') items=items.filter(v=>v.cat===catF);
  if(srcF!=='all') items=items.filter(v=>v.src===srcF);
  if(typeF!=='all') items=items.filter(v=>(v.t||'word')===typeF);
  if(searchQ){const q=searchQ.toLowerCase();items=items.filter(v=>v.sv.toLowerCase().includes(q)||v.en.toLowerCase().includes(q));}
  return items;
}
function renderList(){
  const items=filtered();
  document.getElementById('lshow').textContent=`Showing ${items.length} of ${allVocab().length} entries`;
  document.getElementById('sn-total').textContent=allVocab().length;
  document.getElementById('sn-pr').textContent=allVocab().filter(v=>v.p).length;
  const list=document.getElementById('vlist');
  list.innerHTML='';
  if(!items.length){list.innerHTML='<div class="empty">No entries found</div>';return;}
  items.forEach(v=>{
    const d=document.createElement('div');
    d.className='card'+(v.p?' pr':v.n?' nw':'');
    const sc=v.src==='Babbel'?'sbabbel':v.src==='Podcast'?'spodcast':'sbabbel';
    const scl=v.src==='Custom'?'background:rgba(124,111,224,.15);color:var(--acc2)':'';
    const badge=v.p?'<span class="bdg bdg-pr">review</span>':v.n?'<span class="bdg bdg-nw">new</span>':'';
    const formsHtml=v.forms?`<div class="forms-row">${v.forms.split('·').map(f=>f.trim()).filter(Boolean).map(f=>{const parts=f.split(':');return parts.length===2?`<span class="form-chip"><b>${parts[0].trim()}</b>: ${parts[1].trim()}</span>`:`<span class="form-chip">${f}</span>`;}).join('')}</div>`:'';
    const safe=v.sv.replace(/'/g,"\\'");
    d.innerHTML=`<div class="cbody"><div class="csv">${v.sv} ${badge}</div><div class="cpron">${v.pron||''}</div><div class="cen">${v.en}</div>${formsHtml}<div class="cmeta"><span class="stag ${sc}" style="${scl}">${v.src}</span><span class="ctag">${v.cat}</span></div></div><button class="spkbtn" onclick="speak('${safe}',this)">🔊</button>`;
    list.appendChild(d);
  });
}
function setCat(f,btn){catF=f;document.querySelectorAll('#cat-row .pill').forEach(b=>b.classList.remove('on','pr','nw'));btn.classList.add(f==='priority'?'pr':f==='new'?'nw':'on');renderList();}
function setSrc(f,btn){srcF=f;document.querySelectorAll('#src-row .pill').forEach(b=>b.classList.remove('on','ba','po'));btn.classList.add(f==='Podcast'?'po':'ba');renderList();}
function doSearch(q){searchQ=q;renderList();}
function setType(f,btn){typeF=f;document.querySelectorAll('#type-row .pill').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderList();}

// ── FLASHCARDS ──
let qItems=[],qIdx=0,qCorrect=0,qWrong=0,qMode='all',qRevealed=false;
function setQMode(m,btn){qMode=m;document.querySelectorAll('.qmode').forEach(b=>b.classList.remove('on'));btn.classList.add('on');startQuiz();}
function startQuiz(){
  let pool=allVocab();
  if(qMode==='priority') pool=pool.filter(v=>v.p);
  else if(qMode==='new') pool=pool.filter(v=>v.n);
  else if(qMode==='custom') pool=CUSTOM;
  qItems=[...pool].sort(()=>Math.random()-.5);
  qIdx=0;qCorrect=0;qWrong=0;renderCard();
}
function renderCard(){
  const wrap=document.getElementById('qcontent');
  if(!qItems.length){wrap.innerHTML='<div class="empty" style="padding:40px">No words in this set yet.</div>';return;}
  if(qIdx>=qItems.length){
    const pct=qItems.length?Math.round(qCorrect/qItems.length*100):0;
    wrap.innerHTML=`<div class="qscore-screen"><div class="qscore-n">${pct}%</div><div class="qscore-l">${qCorrect} / ${qItems.length} known</div><div class="qscore-s">${pct>=80?'Excellent! 🎉':pct>=60?'Good work! 💪':'Keep going! 📚'}</div><button class="qrestart" onclick="startQuiz()">Try again</button></div>`;
    return;
  }
  qRevealed=false;
  const v=qItems[qIdx];
  const pips=qItems.slice(0,Math.min(qItems.length,30)).map((_,i)=>`<div class="qpip${i<qIdx?' done':i===qIdx?' cur':''}"></div>`).join('');
  const formsHtml=v.forms?`<div class="fc-forms-fc">${v.forms}</div>`:'';
  wrap.innerHTML=`
  <div class="qstats">
    <div class="qstat"><div class="qstat-n" style="color:var(--grn)">${qCorrect}</div><div class="qstat-l">known</div></div>
    <div class="qstat"><div class="qstat-n" style="color:var(--txt3)">${qItems.length-qIdx}</div><div class="qstat-l">left</div></div>
    <div class="qstat"><div class="qstat-n" style="color:var(--red)">${qWrong}</div><div class="qstat-l">missed</div></div>
  </div>
  <div class="qprog">${pips}</div>
  <div class="flashcard" onclick="revealCard()" id="fc-card">
    <div class="fc-hint">Translate to Swedish</div>
    <div class="fc-q">${v.en}</div>
    <div class="fc-sub">${v.cat} · ${v.src}</div>
    <div class="tap-hint">Tap to reveal</div>
    <div class="fc-reveal" id="fc-reveal">
      <div class="fc-ans">${v.sv}</div>
      <div class="fc-pron">${v.pron||''}</div>
      ${formsHtml}
      <button onclick="event.stopPropagation();speak('${v.sv.replace(/'/g,"\\'")}',this)" style="margin-top:10px;background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:6px 16px;color:var(--txt2);cursor:pointer;font-size:13px">🔊 Listen</button>
    </div>
  </div>
  <div class="fc-actions" id="fc-actions" style="display:none">
    <button class="fc-btn fc-no" onclick="markCard(false)">✗ Didn't know</button>
    <button class="fc-btn fc-yes" onclick="markCard(true)">✓ Got it</button>
  </div>`;
}
function revealCard(){
  if(qRevealed)return;
  qRevealed=true;
  document.getElementById('fc-reveal').classList.add('show');
  document.getElementById('fc-actions').style.display='flex';
  const card=document.getElementById('fc-card');
  card.querySelector('.tap-hint').style.display='none';
}
function markCard(knew){
  if(knew)qCorrect++;else qWrong++;
  qIdx++;renderCard();
}

// ── GEMINI KEY ──
function saveGeminiKey(){
  const k=document.getElementById('gemini-key-input').value.trim();
  if(!k){alert('Please paste your API key first.');return;}
  localStorage.setItem('sv_gemini_key',k);
  document.getElementById('gemini-key-input').value='';
  updateKeyStatus();
  alert('Key saved! You can now use Smart Expand.');
}
function clearGeminiKey(){
  localStorage.removeItem('sv_gemini_key');
  updateKeyStatus();
}
function updateKeyStatus(){
  const k=localStorage.getItem('sv_gemini_key');
  const el=document.getElementById('key-status');
  if(el) el.textContent=k?'✓ API key saved ('+k.slice(0,8)+'…)':'No key saved yet.';
}
updateKeyStatus();

// ── AI EXPAND (Gemini) ──
let expandedData=null;
async function doExpand(){
  const input=document.getElementById('ai-input').value.trim();
  if(!input)return;
  const key=localStorage.getItem('sv_gemini_key');
  if(!key){
    document.getElementById('ai-result').textContent='Please save your Gemini API key first (see section above).';
    document.getElementById('ai-result').classList.add('show');
    return;
  }
  const spin=document.getElementById('ai-spin');
  const lbl=document.getElementById('ai-label');
  const res=document.getElementById('ai-result');
  const prev=document.getElementById('form-preview');
  const saveBtn=document.getElementById('save-expanded-btn');
  spin.style.display='inline-block';lbl.textContent='Analysing…';
  res.classList.remove('show');prev.classList.remove('show');saveBtn.style.display='none';
  expandedData=null;
  const prompt=`You are a Swedish language expert. The user entered: "${input}"
Respond ONLY with a JSON object, no markdown, no explanation:
{
  "sv": "canonical Swedish form",
  "pron": "pronunciation guide in simple English phonetics (CAPS for stress)",
  "en": "English translation",
  "cat": "one of: Greetings|Family|People|Daily life|Weather|Restaurant|Questions|Directions|Transport|Social|Pronouns|Pronunciation",
  "forms": "key grammatical forms separated by · e.g. plural: hundar · definite: hunden · past: åt · present: äter",
  "notes": "one short grammar tip (max 15 words)"
}
If input is a phrase or sentence, set forms to empty string.`;
  try{
    const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.1,maxOutputTokens:400}})});
    const data=await r.json();
    if(data.error){throw new Error(data.error.message);}
    let text=data.candidates[0].content.parts[0].text.replace(/```json|```/g,'').trim();
    expandedData=JSON.parse(text);
    document.getElementById('fp-sv').textContent=expandedData.sv;
    document.getElementById('fp-pron').textContent=expandedData.pron;
    document.getElementById('fp-en').textContent=expandedData.en;
    document.getElementById('fp-forms').textContent=expandedData.forms+(expandedData.notes?'\n💡 '+expandedData.notes:'');
    prev.classList.add('show');
    res.textContent='';res.classList.remove('show');
    saveBtn.style.display='block';
  }catch(e){
    res.textContent='Error: '+e.message+'. Check your API key or internet connection.';
    res.classList.add('show');
  }
  spin.style.display='none';lbl.textContent='Expand & generate forms';
}
function saveExpanded(){
  if(!expandedData)return;
  const entry={sv:expandedData.sv,pron:expandedData.pron,en:expandedData.en,cat:expandedData.cat||'Social',forms:expandedData.forms||'',p:0,n:1,src:'Custom'};
  CUSTOM.push(entry);saveCustom(CUSTOM);
  document.getElementById('ai-input').value='';
  document.getElementById('form-preview').classList.remove('show');
  document.getElementById('save-expanded-btn').style.display='none';
  expandedData=null;
  renderCustomList();
  document.getElementById('sn-total').textContent=allVocab().length;
  alert('Added: '+entry.sv);
}
function manualAdd(){
  const sv=document.getElementById('m-sv').value.trim();
  const en=document.getElementById('m-en').value.trim();
  if(!sv||!en){alert('Please fill in at least Swedish and English fields.');return;}
  const entry={
    sv,pron:document.getElementById('m-pron').value.trim(),
    en,cat:document.getElementById('m-cat').value,
    forms:document.getElementById('m-forms').value.trim(),
    p:document.getElementById('m-pr').checked?1:0,n:1,src:'Custom'
  };
  CUSTOM.push(entry);saveCustom(CUSTOM);
  ['m-sv','m-pron','m-en','m-forms'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('m-pr').checked=false;
  renderCustomList();
  document.getElementById('sn-total').textContent=allVocab().length;
  alert('Added: '+sv);
}
function deleteCustom(i){
  if(!confirm('Remove "'+CUSTOM[i].sv+'"?'))return;
  CUSTOM.splice(i,1);saveCustom(CUSTOM);renderCustomList();
  document.getElementById('sn-total').textContent=allVocab().length;
}
function renderCustomList(){
  const sec=document.getElementById('custom-list-section');
  const list=document.getElementById('custom-list');
  document.getElementById('custom-count').textContent=CUSTOM.length;
  if(!CUSTOM.length){sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML=CUSTOM.map((v,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr)"><div style="flex:1"><div style="font-weight:600;font-size:14px">${v.sv}</div><div style="font-size:12px;color:var(--txt3)">${v.en}</div></div><button onclick="deleteCustom(${i})" style="background:rgba(224,112,96,.15);border:none;border-radius:var(--rad2);padding:6px 12px;color:var(--red);cursor:pointer;font-size:13px">Remove</button></div>`).join('');
}

// ── NAV ──
function showScreen(name,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.nbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('screen-'+name).classList.add('on');
  if(btn){
    btn.classList.add('on');
    const nb=document.getElementById('nav-'+name);
    if(nb)nb.classList.add('on');
  }
  if(name==='quiz'&&!qItems.length)startQuiz();
}

// ── INIT ──
document.getElementById('sn-total').textContent=allVocab().length;
document.getElementById('sn-pr').textContent=allVocab().filter(v=>v.p).length;
renderList();
renderCustomList();
</script>
