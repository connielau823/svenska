<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Svenska">
<meta name="theme-color" content="#1a1a2e">
<title>Svenska</title>
<style>
:root{
  --bg:#0f0f1a;--sur:#1a1a2e;--sur2:#22223a;--bdr:#2e2e4a;
  --txt:#f0eef8;--txt2:#a09cc0;--txt3:#6a6888;
  --acc:#7c6fe0;--acc2:#a594f9;
  --grn:#34c988;--red:#e07060;--gold:#f0b429;--blu:#4a9fd4;--pod:#52b788;
  --rad:12px;--rad2:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{padding:52px 16px 10px;background:var(--sur);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header h1{font-size:20px;font-weight:700}
.header h1 span{color:var(--acc2)}
.hstats{display:flex;gap:8px}
.chip{font-size:11px;background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:3px 10px;color:var(--txt2)}
.chip b{color:var(--txt)}
.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0}
.tab{flex:1;padding:11px 4px;font-size:13px;font-weight:600;color:var(--txt3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--acc2);border-bottom-color:var(--acc2)}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.on{display:flex}
/* filters */
.search-bar{padding:10px 14px 6px;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0}
.search-bar input{width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:9px 14px;font-size:15px;color:var(--txt);outline:none}
.search-bar input::placeholder{color:var(--txt3)}
.fscroll{display:flex;gap:7px;overflow-x:auto;padding:8px 14px 10px;background:var(--sur);border-bottom:1px solid var(--bdr);scrollbar-width:none;flex-shrink:0}
.fscroll::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;font-size:12px;font-weight:600;padding:5px 13px;border-radius:20px;border:1.5px solid var(--bdr);color:var(--txt2);background:transparent;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill.pr{background:var(--red);border-color:var(--red);color:#fff}
.pill.nw{background:var(--grn);border-color:var(--grn);color:#000}
.pill.ba{background:var(--blu);border-color:var(--blu);color:#fff}
.pill.po{background:var(--pod);border-color:var(--pod);color:#fff}
.srow{display:flex;align-items:center;gap:8px;padding:6px 14px 8px;background:var(--sur);border-bottom:1px solid var(--bdr);font-size:12px;color:var(--txt2);flex-shrink:0}
.spd{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1.5px solid var(--bdr);color:var(--txt2);background:transparent;cursor:pointer}
.spd.on{border-color:var(--acc2);color:var(--acc2)}
/* list */
.list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lshow{font-size:11px;color:var(--txt3);padding:8px 14px 4px}
.card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--bdr)}
.card.pr{border-left:3px solid var(--red)}
.card.nw{border-left:3px solid var(--grn)}
.cbody{flex:1;min-width:0}
.csv{font-size:16px;font-weight:600;color:var(--txt);line-height:1.3}
.cpron{font-size:12px;color:var(--acc2);font-style:italic;margin-top:2px}
.cen{font-size:13px;color:var(--txt2);margin-top:3px}
.forms-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.form-chip{font-size:10px;background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:2px 8px;color:var(--txt3)}
.form-chip b{color:var(--acc2)}
.cmeta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.stag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.sbabbel{background:rgba(74,159,212,.15);color:var(--blu)}
.spodcast{background:rgba(82,183,136,.15);color:var(--pod)}
.stextbook{background:rgba(163,94,249,.15);color:#a35ef9}
.ctag{font-size:10px;color:var(--txt3)}
.bdg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.bdg-pr{background:rgba(224,112,96,.15);color:var(--red)}
.bdg-nw{background:rgba(52,201,136,.15);color:var(--grn)}
.spkbtn{flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--sur2);border:1.5px solid var(--bdr);color:var(--txt2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.spkbtn.playing{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{padding:60px 24px;text-align:center;color:var(--txt3);font-size:15px}
/* flashcards */
.quiz-wrap{flex:1;overflow-y:auto;padding:16px 16px 100px}
.qmode-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.qmode{font-size:12px;font-weight:600;padding:7px 14px;border-radius:20px;border:1.5px solid var(--bdr);color:var(--txt2);background:transparent;cursor:pointer}
.qmode.on{background:var(--acc);border-color:var(--acc);color:#fff}
.qprog{display:flex;gap:3px;margin-bottom:16px}
.qpip{flex:1;height:4px;border-radius:2px;background:var(--bdr)}
.qpip.done{background:var(--grn)}
.qpip.cur{background:var(--acc2)}
.qstats{display:flex;gap:8px;margin-bottom:14px}
.qstat{flex:1;background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad2);padding:10px;text-align:center}
.qstat-n{font-size:22px;font-weight:700}
.qstat-l{font-size:11px;color:var(--txt3);margin-top:2px}
.flashcard{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad);padding:28px 20px;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:16px;cursor:pointer;position:relative}
.fc-hint{font-size:11px;color:var(--txt3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
.fc-q{font-size:26px;font-weight:700;color:var(--txt);line-height:1.3;margin-bottom:8px}
.fc-sub{font-size:13px;color:var(--txt3)}
.tap-hint{font-size:12px;color:var(--txt3);margin-top:12px}
.fc-reveal{display:none;width:100%;border-top:1px solid var(--bdr);margin-top:16px;padding-top:16px}
.fc-reveal.show{display:block}
.fc-ans{font-size:20px;font-weight:600;color:var(--grn);margin-bottom:6px}
.fc-pron{font-size:13px;color:var(--acc2);font-style:italic;margin-bottom:6px}
.fc-forms-fc{font-size:12px;color:var(--txt3);margin-top:6px}
.fc-actions{display:flex;gap:10px;margin-top:4px}
.fc-btn{flex:1;padding:16px;border-radius:var(--rad2);border:none;font-size:15px;font-weight:700;cursor:pointer}
.fc-no{background:rgba(224,112,96,.2);color:var(--red)}
.fc-yes{background:rgba(52,201,136,.2);color:var(--grn)}
.qscore-screen{text-align:center;padding:40px 20px}
.qscore-n{font-size:72px;font-weight:800;color:var(--acc2);line-height:1}
.qscore-l{font-size:17px;color:var(--txt2);margin-top:10px}
.qscore-s{font-size:13px;color:var(--txt3);margin-top:4px}
.qrestart{margin-top:28px;background:var(--acc);color:#fff;padding:14px 32px;border-radius:var(--rad2);font-size:16px;font-weight:700;cursor:pointer;border:none}

.verb-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad);padding:20px;margin-bottom:14px}
.verb-inf{font-size:22px;font-weight:700;color:var(--acc2);margin-bottom:4px}
.verb-en{font-size:13px;color:var(--txt3);margin-bottom:16px}
.verb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.verb-label{font-size:12px;color:var(--txt2);width:70px;flex-shrink:0}
.verb-input{flex:1;background:var(--sur2);border:1.5px solid var(--bdr);border-radius:var(--rad2);padding:10px 12px;font-size:15px;color:var(--txt);outline:none;font-family:inherit}
.verb-input:focus{border-color:var(--acc)}
.verb-input.correct{border-color:var(--grn);background:rgba(52,201,136,.08)}
.verb-input.wrong{border-color:var(--red);background:rgba(224,112,96,.08)}
.verb-input.revealed{border-color:var(--acc2);color:var(--acc2)}
.verb-check{width:100%;padding:13px;border-radius:var(--rad2);border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;margin-top:6px}
.verb-next{width:100%;padding:13px;border-radius:var(--rad2);border:1.5px solid var(--bdr);font-size:15px;font-weight:700;cursor:pointer;background:transparent;color:var(--txt);margin-top:8px}
.verb-score{text-align:center;padding:30px 20px}

.verb-card{background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad);padding:20px;margin-bottom:14px}
.verb-inf{font-size:22px;font-weight:700;color:var(--acc2);margin-bottom:4px}
.verb-en{font-size:13px;color:var(--txt3);margin-bottom:16px}
.verb-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.verb-label{font-size:12px;color:var(--txt2);width:70px;flex-shrink:0}
.verb-input{flex:1;background:var(--sur2);border:1.5px solid var(--bdr);border-radius:var(--rad2);padding:10px 12px;font-size:15px;color:var(--txt);outline:none;font-family:inherit}
.verb-input:focus{border-color:var(--acc)}
.verb-input.correct{border-color:var(--grn);background:rgba(52,201,136,.08)}
.verb-input.wrong{border-color:var(--red);background:rgba(224,112,96,.08)}
.verb-input.revealed{border-color:var(--acc2);color:var(--acc2)}
.verb-check{width:100%;padding:13px;border-radius:var(--rad2);border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--acc);color:#fff;margin-top:6px}
.verb-score{text-align:center;padding:30px 20px}

/* nav */
.bnav{display:flex;background:var(--sur);border-top:1px solid var(--bdr);padding:8px 0 calc(8px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:0;right:0;z-index:20}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;cursor:pointer;color:var(--txt3);font-size:10px;font-weight:600}
.nbtn.on{color:var(--acc2)}
.nicon{font-size:22px}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>🇸🇪 <span>Svenska</span></h1>
  <div class="hstats">
    <div class="chip"><b id="sn-total">0</b> words</div>
    <div class="chip" style="color:var(--red)"><b id="sn-pr">0</b> review</div>
  </div>
</div>
<div class="tabs">
  <button class="tab on" onclick="showScreen('browse',this)">Browse</button>
  <button class="tab" onclick="showScreen('quiz',this)">Flashcards</button>
  <button class="tab" onclick="showScreen('verbs',this)">Verbs</button>
</div>

<!-- BROWSE -->
<div id="screen-browse" class="screen on">
  <div class="search-bar">
    <input type="search" placeholder="Search Swedish or English..." oninput="doSearch(this.value)">
  </div>
  <div class="fscroll" id="src-row">
    <button class="pill ba" onclick="setSrc('all',this)">All sources</button>
    <button class="pill" onclick="setSrc('Babbel',this)">Babbel</button>
    <button class="pill" onclick="setSrc('Podcast',this)">Podcast PDF</button>
    <button class="pill" onclick="setSrc('Textbook',this)">Textbook</button>
  </div>
  <div class="fscroll" id="cat-row">
    <button class="pill on" onclick="setCat('all',this)">All</button>
    <button class="pill pr" onclick="setCat('priority',this)">Review</button>
    <button class="pill nw" onclick="setCat('new',this)">New</button>
    <button class="pill" onclick="setCat('Greetings',this)">Greetings</button>
    <button class="pill" onclick="setCat('Family',this)">Family</button>
    <button class="pill" onclick="setCat('People',this)">People</button>
    <button class="pill" onclick="setCat('Daily life',this)">Daily life</button>
    <button class="pill" onclick="setCat('Weather',this)">Weather</button>
    <button class="pill" onclick="setCat('Restaurant',this)">Restaurant</button>
    <button class="pill" onclick="setCat('Questions',this)">Questions</button>
    <button class="pill" onclick="setCat('Directions',this)">Directions</button>
    <button class="pill" onclick="setCat('Transport',this)">Transport</button>
    <button class="pill" onclick="setCat('Social',this)">Social</button>
    <button class="pill" onclick="setCat('Pronouns',this)">Pronouns</button>
    <button class="pill" onclick="setCat('Pronunciation',this)">Pronunciation</button>
  </div>
  <div class="fscroll" id="type-row">
    <button class="pill on" onclick="setType('all',this)">All types</button>
    <button class="pill" onclick="setType('word',this)">Words</button>
    <button class="pill" onclick="setType('sentence',this)">Sentences</button>
  </div>
  <div class="srow">
    🔊 Speed:
    <button class="spd" onclick="setSpd(0.6,this)">Slow</button>
    <button class="spd on" onclick="setSpd(0.85,this)">Normal</button>
    <button class="spd" onclick="setSpd(1.1,this)">Fast</button>
    <span id="vlabel" style="font-size:11px;color:var(--txt3);margin-left:4px">loading…</span>
  </div>
  <div class="list-wrap">
    <div class="lshow" id="lshow"></div>
    <div id="vlist"></div>
  </div>
</div>

<!-- FLASHCARDS -->
<div id="screen-quiz" class="screen">
  <div class="quiz-wrap">
    <div style="padding:10px 0 4px;font-size:12px;color:var(--txt3)">Cards are shown based on spaced repetition &mdash; new and due cards first.</div>
    <div class="qmode-row">
      <button class="qmode" onclick="setQMode('due',this)" id="btn-due">&#9200; Due now (0)</button>
      <button class="qmode on" onclick="setQMode('all',this)">All words</button>
      <button class="qmode" onclick="setQMode('missed',this)">&#10007; Missed</button>
    </div>
    <div id="missed-info" style="display:none;font-size:12px;color:var(--txt3);margin-bottom:8px;padding:8px 12px;background:var(--sur);border-radius:var(--rad2)">Words you marked as &ldquo;Didn&rsquo;t know&rdquo; this session.</div>
    <div id="qcontent"></div>
  </div>
</div>

<!-- VERB QUIZ -->
<div id="screen-verbs" class="screen">
  <div style="padding:12px 14px 6px;background:var(--sur);border-bottom:1px solid var(--bdr);flex-shrink:0">
    <div style="font-size:12px;color:var(--txt3);margin-bottom:8px">Given the infinitive, type all conjugated forms. Loose matching — accents optional.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap" id="vquiz-mode-row">
      <button class="qmode on" onclick="setVMode('inf-to-forms',this)">Forms from infinitive</button>
      <button class="qmode" onclick="setVMode('forms-to-inf',this)">Infinitive from form</button>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:14px 14px 100px" id="vquiz-wrap">
    <div id="vquiz-content"></div>
  </div>
</div>

</div>

<nav class="bnav">
  <button class="nbtn on" id="nav-browse" onclick="showScreen('browse',this)"><span class="nicon">📚</span>Browse</button>
  <button class="nbtn" id="nav-quiz" onclick="showScreen('quiz',this)"><span class="nicon">🃏</span>Flashcards</button>
  <button class="nbtn" id="nav-verbs" onclick="showScreen('verbs',this)"><span class="nicon">📝</span>Verbs</button>
</nav>

<!-- VERB QUIZ -->
<div id="screen-verbs" class="screen">
  <div class="quiz-wrap">
    <div class="qmode-row">
      <button class="qmode on" onclick="setVMode('conjugate',this)">Fill in the form</button>
      <button class="qmode" onclick="setVMode('identify',this)">What does it mean?</button>
    </div>
    <div id="verb-content"></div>
  </div>
</div>

<script>
const VOCAB=[

  {sv:'Det regnar i Skåne',pron:'deh REG-nar ee SKAW-neh',en:'It\'s raining in Skåne',src:'Babbel',cat:'Weather',p:0,n:0,t:'sentence',forms:''},

var svVoice=null, spRate=0.85, curBtn=null;
function loadVoice(){
  var vv=window.speechSynthesis.getVoices();
  svVoice=vv.find(function(v){return v.lang.startsWith('sv');})||null;
  document.getElementById('vlabel').textContent=svVoice?'('+svVoice.name+')':'(no sv voice)';
}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoice;loadVoice();}
function speak(text,btn){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  if(curBtn&&curBtn!==btn){curBtn.classList.remove('playing');curBtn.textContent='🔊';}
  var u=new SpeechSynthesisUtterance(text);
  if(svVoice)u.voice=svVoice;
  u.lang='sv-SE';u.rate=spRate;
  btn.classList.add('playing');btn.textContent='⏸';curBtn=btn;
  u.onend=function(){btn.classList.remove('playing');btn.textContent='🔊';curBtn=null;};
  window.speechSynthesis.speak(u);
}
function setSpd(r,btn){
  spRate=r;
  document.querySelectorAll('.spd').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
}

var catF='all', srcF='all', typeF='all', searchQ='';
function filtered(){
  var items=VOCAB.slice();
  if(catF==='priority') items=items.filter(function(v){return v.p;});
  else if(catF==='new') items=items.filter(function(v){return v.n;});
  else if(catF!=='all') items=items.filter(function(v){return v.cat===catF;});
  if(srcF!=='all') items=items.filter(function(v){return v.src===srcF;});
  if(typeF!=='all') items=items.filter(function(v){return (v.t||'word')===typeF;});
  if(searchQ){
    var q=searchQ.toLowerCase();
    items=items.filter(function(v){return v.sv.toLowerCase().indexOf(q)>=0||v.en.toLowerCase().indexOf(q)>=0;});
  }
  return items;
}
function renderList(){
  var items=filtered();
  document.getElementById('lshow').textContent='Showing '+items.length+' of '+VOCAB.length+' entries';
  document.getElementById('sn-total').textContent=VOCAB.length;
  document.getElementById('sn-pr').textContent=VOCAB.filter(function(v){return v.p;}).length;
  var list=document.getElementById('vlist');
  list.innerHTML='';
  if(!items.length){
    var empty=document.createElement('div');
    empty.className='empty';
    empty.textContent='No entries found';
    list.appendChild(empty);
    return;
  }
  items.forEach(function(v){
    var d=document.createElement('div');
    d.className='card'+(v.p?' pr':v.n?' nw':'');
    // source tag
    var sc=v.src==='Babbel'?'sbabbel':v.src==='Textbook'?'stextbook':'spodcast';
    // badge
    var badge='';
    if(v.p) badge='<span class="bdg bdg-pr">review</span>';
    else if(v.n) badge='<span class="bdg bdg-nw">new</span>';
    // forms chips
    var formsHtml='';
    if(v.forms&&v.forms.length>0){
      var chips='';
      var parts=v.forms.split('\u00b7');
      for(var i=0;i<parts.length;i++){
        var part=parts[i].trim();
        if(!part) continue;
        var colon=part.indexOf(':');
        if(colon>0){
          chips+='<span class="form-chip"><b>'+part.slice(0,colon).trim()+'</b>: '+part.slice(colon+1).trim()+'</span>';
        } else {
          chips+='<span class="form-chip">'+part+'</span>';
        }
      }
      formsHtml='<div class="forms-row">'+chips+'</div>';
    }
    // body
    var body=document.createElement('div');
    body.className='cbody';
    body.innerHTML=
      '<div class="csv">'+v.sv+' '+badge+'</div>'+
      '<div class="cpron">'+v.pron+'</div>'+
      '<div class="cen">'+v.en+'</div>'+
      formsHtml+
      '<div class="cmeta"><span class="stag '+sc+'">'+v.src+'</span><span class="ctag">'+v.cat+'</span></div>';
    // speak button
    var btn=document.createElement('button');
    btn.className='spkbtn';
    btn.textContent='🔊';
    btn.setAttribute('data-sv',v.sv);
    btn.onclick=function(){speak(this.getAttribute('data-sv'),this);};
    d.appendChild(body);
    d.appendChild(btn);
    list.appendChild(d);
  });

// ── SPACED REPETITION (SM-2) ──
// Each card state: {interval, easeFactor, due, reps}
// interval: days until next review
// easeFactor: multiplier (starts 2.5)
// due: timestamp (ms) when card is next due
// reps: number of successful reviews

var SRS_KEY = 'sv_srs_v1';
var srsData = {};

function loadSRS(){
  try { srsData = JSON.parse(localStorage.getItem(SRS_KEY) || '{}'); }
  catch(e){ srsData = {}; }
}
function saveSRS(){ localStorage.setItem(SRS_KEY, JSON.stringify(srsData)); }

function getCard(sv){
  if(!srsData[sv]) srsData[sv] = {interval:0, ef:2.5, due:0, reps:0};
  return srsData[sv];
}

// SM-2 algorithm: quality 0-5 (we use 0=fail, 3=hard, 4=good, 5=easy)
function reviewCard(sv, quality){
  var c = getCard(sv);
  var now = Date.now();

  if(quality < 3){
    // Fail: reset repetitions, review soon
    c.reps = 0;
    c.interval = 1;
  } else {
    // SM-2 interval calculation
    if(c.reps === 0) c.interval = 1;
    else if(c.reps === 1) c.interval = 6;
    else c.interval = Math.round(c.interval * c.ef);

    // Update ease factor
    c.ef = c.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
    if(c.ef < 1.3) c.ef = 1.3;
    c.reps++;
  }

  // Set due date
  c.due = now + c.interval * 24 * 60 * 60 * 1000;
  srsData[sv] = c;
  saveSRS();
}

function isDue(sv){
  var c = getCard(sv);
  return Date.now() >= c.due;
}

function getDueCount(){
  return VOCAB.filter(function(v){ return isDue(v.sv); }).length;
}

function getIntervalLabel(sv){
  var c = getCard(sv);
  if(c.reps === 0) return 'New';
  var days = Math.round((c.due - Date.now()) / (24*60*60*1000));
  if(days <= 0) return 'Due now';
  if(days === 1) return 'Tomorrow';
  return 'In ' + days + ' days';
}

// ── FLASHCARDS ──
var qItems=[], qIdx=0, qCorrect=0, qWrong=0, qMode='all', qRevealed=false;
var missedWords=[];

loadSRS();

function updateDueBtn(){
  var btn = document.querySelector('.qmode[onclick*="due"]');
  if(btn){
    var n = getDueCount();
    btn.textContent = '\u23F0 Due now (' + n + ')';
  }
}

function setQMode(m, btn){
  qMode = m;
  document.querySelectorAll('.qmode').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  var info = document.getElementById('missed-info');
  if(info) info.style.display = (m==='missed' ? 'block' : 'none');
  startQuiz();
}

function startQuiz(){
  var pool;
  if(qMode === 'due'){
    pool = VOCAB.filter(function(v){ return isDue(v.sv); });
    // Sort: new cards first, then by due date
    pool.sort(function(a, b){
      var ca = getCard(a.sv), cb = getCard(b.sv);
      if(ca.reps === 0 && cb.reps > 0) return -1;
      if(cb.reps === 0 && ca.reps > 0) return 1;
      return ca.due - cb.due;
    });
  } else if(qMode === 'missed'){
    pool = missedWords.slice();
    if(!pool.length){
      var wrap = document.getElementById('qcontent');
      wrap.innerHTML = '<div class="empty" style="padding:40px">No missed words yet.<br>Complete a round first!</div>';
      return;
    }
    // Shuffle missed too
    pool = pool.sort(function(){ return Math.random() - 0.5; });
  } else {
    // All — shuffle
    pool = VOCAB.slice().sort(function(){ return Math.random() - 0.5; });
  }
  // Always shuffle due cards too
  if(qMode === 'due') pool = pool.sort(function(){ return Math.random() - 0.5; });
  qItems = pool;
  qIdx = 0; qCorrect = 0; qWrong = 0;
  renderCard();
}

function renderCard(){
  var wrap = document.getElementById('qcontent');
  if(!qItems.length){
    var dueCount = getDueCount();
    wrap.innerHTML =
      '<div class="qscore-screen">'
      + '<div class="qscore-n">🎉</div>'
      + '<div class="qscore-l">No cards due right now!</div>'
      + '<div class="qscore-s">Check back later or study all words.</div>'
      + '<button class="qrestart" onclick="setQMode(\'all\', document.querySelector(\'.qmode[onclick*=all]\'))">Study all words</button>'
      + '</div>';
    return;
  }
  if(qIdx >= qItems.length){
    var pct = Math.round(qCorrect / qItems.length * 100);
    var emoji = pct>=80 ? 'Excellent! \uD83C\uDF89' : pct>=60 ? 'Good work! \uD83D\uDCAA' : 'Keep going! \uD83D\uDCDA';
    var missedBtn = missedWords.length
      ? '<button class="qrestart" style="background:var(--red);margin-top:8px" onclick="practiceMissed()">Practice ' + missedWords.length + ' missed</button>'
      : '';
    wrap.innerHTML =
      '<div class="qscore-screen">'
      + '<div class="qscore-n">' + pct + '%</div>'
      + '<div class="qscore-l">' + qCorrect + ' / ' + qItems.length + ' correct</div>'
      + '<div class="qscore-s">' + emoji + '</div>'
      + '<button class="qrestart" onclick="startQuiz()">Review again</button>'
      + missedBtn
      + '</div>';
    updateDueBtn();
    return;
  }

  qRevealed = false;
  var v = qItems[qIdx];
  var card = getCard(v.sv);
  var total = Math.min(qItems.length, 40);
  var pips = '';
  for(var i=0; i<total; i++){
    pips += '<div class="qpip' + (i<qIdx?' done':i===qIdx?' cur':'') + '"></div>';
  }
  var formsHtml = v.forms ? '<div class="fc-forms-fc">' + v.forms + '</div>' : '';
  var intervalLabel = getIntervalLabel(v.sv);
  var isNew = card.reps === 0;

  var html = '';
  html += '<div class="qstats">';
  html += '<div class="qstat"><div class="qstat-n" style="color:var(--grn)">' + qCorrect + '</div><div class="qstat-l">correct</div></div>';
  html += '<div class="qstat"><div class="qstat-n" style="color:var(--txt3)">' + (qItems.length-qIdx) + '</div><div class="qstat-l">left</div></div>';
  html += '<div class="qstat"><div class="qstat-n" style="color:var(--red)">' + qWrong + '</div><div class="qstat-l">missed</div></div>';
  html += '</div>';
  html += '<div class="qprog">' + pips + '</div>';
  html += '<div class="flashcard" id="fc-card" onclick="revealCard()">';
  html += '<div class="fc-hint">' + (isNew ? '\u2728 New card' : '\uD83D\uDD01 ' + intervalLabel) + '</div>';
  html += '<div class="fc-q">' + v.en + '</div>';
  html += '<div class="fc-sub">' + v.cat + ' &middot; ' + v.src + '</div>';
  html += '<div class="tap-hint">Tap to reveal</div>';
  html += '<div class="fc-reveal" id="fc-reveal">';
  html += '<div class="fc-ans">' + v.sv + '</div>';
  html += '<div class="fc-pron">' + v.pron + '</div>';
  html += formsHtml;
  html += '<button id="fc-speak-btn" style="margin-top:10px;background:var(--sur2);border:1px solid var(--bdr);border-radius:20px;padding:6px 16px;color:var(--txt2);cursor:pointer;font-size:13px">\uD83D\uDD0A Listen</button>';
  html += '</div></div>';
  // SRS rating buttons (shown after reveal)
  html += '<div class="fc-actions" id="fc-actions" style="display:none">';
  html += '<button class="fc-btn fc-no" onclick="markCard(0)">\u2717 Didn\'t know</button>';
  html += '<button class="fc-btn" style="background:rgba(240,180,41,.2);color:var(--gold)" onclick="markCard(3)">Hard</button>';
  html += '<button class="fc-btn fc-yes" onclick="markCard(5)">\u2713 Got it</button>';
  html += '</div>';
  // Next interval preview (shown after reveal)
  html += '<div id="interval-preview" style="display:none;text-align:center;font-size:11px;color:var(--txt3);margin-top:8px;gap:8px;justify-content:space-around;display:none">';
  html += '</div>';
  wrap.innerHTML = html;

  // Attach speak button
  var speakBtn = document.getElementById('fc-speak-btn');
  if(speakBtn){
    var sv = v.sv;
    speakBtn.onclick = function(e){ e.stopPropagation(); speak(sv, this); };
  }
}

function revealCard(){
  if(qRevealed) return;
  qRevealed = true;
  document.getElementById('fc-reveal').classList.add('show');
  document.getElementById('fc-actions').style.display = 'flex';
  document.getElementById('fc-card').querySelector('.tap-hint').style.display = 'none';

  // Show interval preview for each button
  var v = qItems[qIdx];
  var c = getCard(v.sv);
  var preview = document.getElementById('interval-preview');
  if(preview){
    var intervals = [
      {q:0, label:'\u2717', next:'Tomorrow'},
      {q:3, label:'Hard', next: c.reps===0?'6 days':'~'+(Math.round(Math.max(c.interval,1)*Math.max(c.ef+0.1-(5-3)*(0.08+(5-3)*0.02),1.3)))+'d'},
      {q:5, label:'\u2713', next: c.reps===0?'6 days':'~'+(Math.round(c.interval*c.ef))+'d'},
    ];
    var html='<div style="display:flex;justify-content:space-around;width:100%;margin-top:6px">';
    intervals.forEach(function(iv){
      html += '<span style="font-size:10px;color:var(--txt3)">' + iv.next + '</span>';
    });
    html += '</div>';
    preview.innerHTML = html;
    preview.style.display = 'flex';
  }
}

function markCard(quality){
  var v = qItems[qIdx];
  reviewCard(v.sv, quality);

  if(quality < 3){
    qWrong++;
    var alreadyMissed = missedWords.some(function(m){ return m.sv === v.sv; });
    if(!alreadyMissed) missedWords.push(v);
    var btn = document.querySelector('.qmode[onclick*="missed"]');
    if(btn) btn.textContent = '\u2717 Missed (' + missedWords.length + ')';
  } else {
    qCorrect++;
    if(qMode === 'missed'){
      missedWords = missedWords.filter(function(m){ return m.sv !== v.sv; });
      var btn2 = document.querySelector('.qmode[onclick*="missed"]');
      if(btn2) btn2.textContent = missedWords.length ? '\u2717 Missed ('+missedWords.length+')' : '\u2717 Missed';
    }
  }
  qIdx++;
  renderCard();
}

function practiceMissed(){
  var btn = document.querySelector('.qmode[onclick*="missed"]');
  if(btn) setQMode('missed', btn);
}

function normSv(s){
  return s.toLowerCase().trim()
    .replace(/[\u00e5\u00e4]/g,'a').replace(/\u00f6/g,'o');
}
function matchSv(input,correct){
  return input.toLowerCase().trim()===correct.toLowerCase().trim()
    || normSv(input)===normSv(correct);
}

var vMode='conjugate',vItems=[],vIdx=0,vCorrect=0,vWrong=0;

function setVMode(m,btn){
  vMode=m;
  document.querySelectorAll('#screen-verbs .qmode').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  startVerbQuiz();
}

function startVerbQuiz(){
  vItems=VERBS.slice().sort(function(){return Math.random()-.5;});
  vIdx=0;vCorrect=0;vWrong=0;
  renderVerb();
}

function vStats(){
  return '<div class="qstats">'
    +'<div class="qstat"><div class="qstat-n" style="color:var(--grn)">'+vCorrect+'</div><div class="qstat-l">correct</div></div>'
    +'<div class="qstat"><div class="qstat-n" style="color:var(--txt3)">'+(vItems.length-vIdx)+'</div><div class="qstat-l">left</div></div>'
    +'<div class="qstat"><div class="qstat-n" style="color:var(--red)">'+vWrong+'</div><div class="qstat-l">missed</div></div>'
    +'</div>';
}

function vPips(){
  var total=Math.min(vItems.length,30),p='';
  for(var i=0;i<total;i++) p+='<div class="qpip'+(i<vIdx?' done':i===vIdx?' cur':'')+'"></div>';
  return '<div class="qprog">'+p+'</div>';
}

function renderVerb(){
  var wrap=document.getElementById('verb-content');
  if(!vItems.length){wrap.innerHTML='<div class="empty" style="padding:40px">No verbs found.</div>';return;}
  if(vIdx>=vItems.length){
    var pct=Math.round(vCorrect/vItems.length*100);
    var msg=pct>=80?'Excellent!':pct>=60?'Good work!':'Keep going!';
    wrap.innerHTML='<div class="verb-score"><div class="qscore-n">'+pct+'%</div>'
      +'<div class="qscore-l">'+vCorrect+' / '+vItems.length+' correct</div>'
      +'<div class="qscore-s">'+msg+'</div>'
      +'<button class="qrestart" onclick="startVerbQuiz()">Try again</button></div>';
    return;
  }
  var v=vItems[vIdx];
  if(vMode==='conjugate'){
    wrap.innerHTML=vStats()+vPips()
      +'<div class="verb-card">'
        +'<div class="verb-inf">'+v.inf+'</div>'
        +'<div class="verb-en">'+v.en+'</div>'
        +'<div class="verb-row"><span class="verb-label">Present</span>'
          +'<input class="verb-input" id="vi-pres" placeholder="presens..." autocorrect="off" autocapitalize="off" spellcheck="false">'
        +'</div>'
        +'<div class="verb-row"><span class="verb-label">Past</span>'
          +'<input class="verb-input" id="vi-past" placeholder="preteritum..." autocorrect="off" autocapitalize="off" spellcheck="false">'
        +'</div>'
        +'<div class="verb-row"><span class="verb-label">Supine</span>'
          +'<input class="verb-input" id="vi-sup" placeholder="supinum..." autocorrect="off" autocapitalize="off" spellcheck="false">'
        +'</div>'
        +'<button class="verb-check" id="vc-btn" onclick="checkVerb()">Check</button>'
      +'</div>';
    setTimeout(function(){
      var ids=['vi-pres','vi-past','vi-sup'];
      var el=document.getElementById('vi-pres');
      if(el) el.focus();
      ids.forEach(function(id,i){
        var inp=document.getElementById(id);
        if(!inp) return;
        inp.addEventListener('keydown',function(e){
          if(e.key==='Enter'){
            if(i<ids.length-1){var n=document.getElementById(ids[i+1]);if(n)n.focus();}
            else checkVerb();
          }
        });
      });
    },80);
  } else {
    var forms=[
      {form:v.pres,label:'Present tense'},
      {form:v.past,label:'Past tense'},
      {form:v.sup, label:'Supine'}
    ];
    var picked=forms[Math.floor(Math.random()*forms.length)];
    wrap.innerHTML=vStats()+vPips()
      +'<div class="verb-card">'
        +'<div class="verb-inf" style="color:var(--txt)">'+picked.form+'</div>'
        +'<div class="verb-en">'+picked.label+' &mdash; write the infinitive</div>'
        +'<div class="verb-row"><span class="verb-label">Infinitive</span>'
          +'<input class="verb-input" id="vi-inf" placeholder="att..." autocorrect="off" autocapitalize="off" spellcheck="false">'
        +'</div>'
        +'<button class="verb-check" id="vc-btn" onclick="checkVerbId()">Check</button>'
      +'</div>';
    setTimeout(function(){
      var el=document.getElementById('vi-inf');
      if(el){
        el.focus();
        el.addEventListener('keydown',function(e){if(e.key==='Enter') checkVerbId();});
      }
    },80);
    wrap.setAttribute('data-vinf',v.inf);
    wrap.setAttribute('data-ven',v.en);
  }
}

function checkVerb(){
  var v=vItems[vIdx];
  var pres=document.getElementById('vi-pres');
  var past=document.getElementById('vi-past');
  var sup=document.getElementById('vi-sup');
  if(!pres||!past||!sup) return;
  var ok1=matchSv(pres.value,v.pres);
  var ok2=matchSv(past.value,v.past);
  var ok3=matchSv(sup.value,v.sup);
  pres.className='verb-input '+(ok1?'correct':'wrong');
  past.className='verb-input '+(ok2?'correct':'wrong');
  sup.className ='verb-input '+(ok3?'correct':'wrong');
  if(!ok1){pres.value=v.pres;pres.className='verb-input revealed';}
  if(!ok2){past.value=v.past;past.className='verb-input revealed';}
  if(!ok3){sup.value=v.sup;sup.className='verb-input revealed';}
  if(ok1&&ok2&&ok3) vCorrect++; else vWrong++;
  pres.disabled=true;past.disabled=true;sup.disabled=true;
  var btn=document.getElementById('vc-btn');
  if(btn){btn.textContent='Next \u2192';btn.onclick=function(){vIdx++;renderVerb();};}
}

function checkVerbId(){
  var wrap=document.getElementById('verb-content');
  var correctInf=wrap.getAttribute('data-vinf');
  var correctEn=wrap.getAttribute('data-ven');
  var inp=document.getElementById('vi-inf');
  if(!inp||!correctInf) return;
  var ok=matchSv(inp.value,correctInf);
  inp.className='verb-input '+(ok?'correct':'wrong');
  if(!ok){inp.value=correctInf+' ('+correctEn+')';inp.className='verb-input revealed';}
  if(ok) vCorrect++; else vWrong++;
  inp.disabled=true;
  var btn=document.getElementById('vc-btn');
  if(btn){btn.textContent='Next \u2192';btn.onclick=function(){vIdx++;renderVerb();};}
}

var VERBS = [];
var vMode = 'inf-to-forms';
var vIdx = 0, vScore = 0, vTotal = 0, vAnswered = false;
var vItems = [];

function buildVerbList(){
  VERBS = [];
  VOCAB.forEach(function(v){
    if(v.sv.indexOf('Att ') !== 0) return;
    if(!v.forms || v.forms.length === 0) return;
    // Parse forms: "present: X · past: Y · supine: Z"
    var parts = v.forms.split('\u00b7');
    var formMap = {};
    parts.forEach(function(p){
      p = p.trim();
      var colon = p.indexOf(':');
      if(colon > 0){
        var key = p.slice(0, colon).trim().toLowerCase();
        var val = p.slice(colon+1).trim();
        formMap[key] = val;
      }
    });
    if(formMap['present'] || formMap['past']){
      VERBS.push({
        inf: v.sv,
        en: v.en,
        pron: v.pron,
        present: formMap['present'] || '',
        past: formMap['past'] || '',
        supine: formMap['supine'] || ''
      });
    }
  });
  return VERBS;
}

function setVMode(m, btn){
  vMode = m;
  document.querySelectorAll('#vquiz-mode-row .qmode').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  startVerbQuiz();
}

function startVerbQuiz(){
  buildVerbList();
  vItems = VERBS.slice().sort(function(){ return Math.random() - 0.5; });
  vIdx = 0; vScore = 0; vTotal = 0; vAnswered = false;
  renderVerbCard();
}

function looseMatch(input, correct){
  if(!input || !correct) return false;
  function norm(s){
    return s.toLowerCase().trim()
      .replace(/aa/g,'\u00e5').replace(/ae/g,'\u00e4').replace(/oe/g,'\u00f6')
      .replace(/[^a-z\u00e5\u00e4\u00f6]/g,'');
  }
  return norm(input) === norm(correct);
}

function renderVerbCard(){
  var wrap = document.getElementById('vquiz-content');
  if(!vItems.length){
    wrap.innerHTML = '<div class="empty" style="padding:40px">No verbs with conjugation data found.</div>';
    return;
  }
  if(vIdx >= vItems.length){
    var pct = vItems.length > 0 ? Math.round(vScore / vTotal * 100) : 0;
    var emoji = pct >= 80 ? 'Excellent! \uD83C\uDF89' : pct >= 60 ? 'Good work! \uD83D\uDCAA' : 'Keep going! \uD83D\uDCDA';
    wrap.innerHTML =
      '<div class="qscore-screen">'
      + '<div class="qscore-n">' + pct + '%</div>'
      + '<div class="qscore-l">' + vScore + ' / ' + vTotal + ' correct</div>'
      + '<div class="qscore-s">' + emoji + '</div>'
      + '<button class="qrestart" onclick="startVerbQuiz()">Try again</button>'
      + '</div>';
    return;
  }

  vAnswered = false;
  var v = vItems[vIdx];
  var pips = '';
  var total = Math.min(vItems.length, 30);
  for(var i=0; i<total; i++){
    pips += '<div class="qpip' + (i<vIdx?' done':i===vIdx?' cur':'') + '"></div>';
  }

  var html = '';
  html += '<div class="qprog">' + pips + '</div>';
  html += '<div style="background:var(--sur);border:1px solid var(--bdr);border-radius:var(--rad);padding:20px 16px;margin-bottom:12px">';

  if(vMode === 'inf-to-forms'){
    html += '<div style="font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Fill in the forms</div>';
    html += '<div style="font-size:22px;font-weight:700;color:var(--txt);margin-bottom:4px">' + v.inf + '</div>';
    html += '<div style="font-size:13px;color:var(--txt2);margin-bottom:16px">' + v.en + '</div>';
    if(v.present) html += '<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--txt3);display:block;margin-bottom:4px">PRESENT</label><input id="v-present" type="text" autocorrect="off" autocapitalize="off" placeholder="present tense..." style="width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:10px 12px;font-size:16px;color:var(--txt);outline:none"></div>';
    if(v.past) html += '<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--txt3);display:block;margin-bottom:4px">PAST</label><input id="v-past" type="text" autocorrect="off" autocapitalize="off" placeholder="past tense..." style="width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:10px 12px;font-size:16px;color:var(--txt);outline:none"></div>';
    if(v.supine) html += '<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--txt3);display:block;margin-bottom:4px">SUPINE</label><input id="v-supine" type="text" autocorrect="off" autocapitalize="off" placeholder="supine..." style="width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:10px 12px;font-size:16px;color:var(--txt);outline:none"></div>';
  } else {
    // Show a random form, ask for infinitive
    var forms = [];
    if(v.present) forms.push({label:'Present', val:v.present});
    if(v.past) forms.push({label:'Past', val:v.past});
    if(v.supine) forms.push({label:'Supine', val:v.supine});
    var pick = forms[Math.floor(Math.random() * forms.length)];
    html += '<div style="font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">What is the infinitive?</div>';
    html += '<div style="font-size:13px;color:var(--acc2);margin-bottom:6px">' + pick.label + '</div>';
    html += '<div style="font-size:28px;font-weight:700;color:var(--txt);margin-bottom:4px">' + pick.val + '</div>';
    html += '<div style="font-size:13px;color:var(--txt2);margin-bottom:16px">' + v.en + '</div>';
    html += '<input id="v-inf-ans" type="text" autocorrect="off" autocapitalize="off" placeholder="att ..." style="width:100%;background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rad2);padding:10px 12px;font-size:16px;color:var(--txt);outline:none">';
    // Store the picked form for checking
    html += '<input type="hidden" id="v-picked-val" value="' + pick.val + '">';
  }

  html += '</div>';
  html += '<div id="vquiz-feedback" style="display:none;margin-bottom:12px;padding:12px 14px;border-radius:var(--rad2);font-size:14px"></div>';
  html += '<div style="display:flex;gap:8px">';
  html += '<button class="fc-btn fc-yes" id="v-check-btn" onclick="checkVerb()" style="flex:2">Check</button>';
  html += '<button class="fc-btn" style="background:var(--sur2);color:var(--txt2);flex:1" onclick="skipVerb()">Skip</button>';
  html += '</div>';
  html += '<div style="text-align:center;margin-top:10px;font-size:12px;color:var(--txt3)">' + (vIdx+1) + ' of ' + vItems.length + ' &nbsp;&middot;&nbsp; Score: ' + vScore + '/' + vTotal + '</div>';

  wrap.innerHTML = html;

  // Focus first input
  var firstInput = document.getElementById('v-present') || document.getElementById('v-inf-ans');
  if(firstInput) setTimeout(function(){ firstInput.focus(); }, 100);

  // Allow Enter key to check
  wrap.querySelectorAll('input[type=text]').forEach(function(inp){
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') checkVerb(); });
  });
}

function checkVerb(){
  if(vAnswered) { nextVerb(); return; }
  vAnswered = true;
  var v = vItems[vIdx];
  var correct = true;
  var feedback = '';

  if(vMode === 'inf-to-forms'){
    var fields = [
      {id:'v-present', correct:v.present, label:'Present'},
      {id:'v-past', correct:v.past, label:'Past'},
      {id:'v-supine', correct:v.supine, label:'Supine'},
    ];
    var fieldResults = [];
    fields.forEach(function(f){
      var inp = document.getElementById(f.id);
      if(!inp || !f.correct) return;
      var ok = looseMatch(inp.value, f.correct);
      inp.style.borderColor = ok ? 'var(--grn)' : 'var(--red)';
      inp.style.background = ok ? 'rgba(52,201,136,.08)' : 'rgba(224,112,96,.08)';
      if(!ok){
        correct = false;
        fieldResults.push(f.label + ': <b style="color:var(--grn)">' + f.correct + '</b>');
      }
      inp.readOnly = true;
    });
    feedback = correct
      ? '\u2713 All correct!'
      : '\u2717 Corrections: ' + fieldResults.join(' &nbsp;&middot;&nbsp; ');
  } else {
    var inp2 = document.getElementById('v-inf-ans');
    var ok2 = looseMatch(inp2 ? inp2.value : '', v.inf) || looseMatch(inp2 ? inp2.value : '', v.inf.replace('Att ','att '));
    if(inp2){
      inp2.style.borderColor = ok2 ? 'var(--grn)' : 'var(--red)';
      inp2.style.background = ok2 ? 'rgba(52,201,136,.08)' : 'rgba(224,112,96,.08)';
      inp2.readOnly = true;
    }
    correct = ok2;
    feedback = ok2 ? '\u2713 Correct!' : '\u2717 Answer: <b style="color:var(--grn)">' + v.inf + '</b>';
  }

  vTotal++;
  if(correct) vScore++;

  var fb = document.getElementById('vquiz-feedback');
  if(fb){
    fb.style.display = 'block';
    fb.style.background = correct ? 'rgba(52,201,136,.12)' : 'rgba(224,112,96,.12)';
    fb.style.color = correct ? 'var(--grn)' : 'var(--red)';
    fb.innerHTML = feedback;
  }

  var btn = document.getElementById('v-check-btn');
  if(btn){ btn.textContent = 'Next \u2192'; btn.className = 'fc-btn'; btn.style.background='var(--sur2)'; btn.style.color='var(--txt2)'; btn.style.flex='2'; }
}

function skipVerb(){ vAnswered = true; nextVerb(); }
function nextVerb(){ vIdx++; vAnswered = false; renderVerbCard(); }


// ── NAV ──
function showScreen(name,btn){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
  document.querySelectorAll('.nbtn').forEach(function(b){b.classList.remove('on');});
  document.getElementById('screen-'+name).classList.add('on');
  if(btn){
    btn.classList.add('on');
    var nb=document.getElementById('nav-'+name);
    if(nb)nb.classList.add('on');
  }
  if(name==='quiz'&&!qItems.length)startQuiz();
  if(name==='verbs')startVerbQuiz();
}

// ── INIT ──
document.getElementById('sn-total').textContent=VOCAB.length;
document.getElementById('sn-pr').textContent=VOCAB.filter(function(v){return v.p;}).length;
renderList();
updateDueBtn();
</script>
