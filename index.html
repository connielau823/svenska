<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Svenska">
<meta name="theme-color" content="#1a1a2e">
<title>Svenska · My Vocab</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223a;
    --border: #2e2e4a;
    --text: #f0eef8;
    --text2: #a09cc0;
    --text3: #6a6888;
    --accent: #7c6fe0;
    --accent2: #a594f9;
    --green: #34c988;
    --coral: #e07060;
    --gold: #f0b429;
    --babbel: #4a9fd4;
    --podcast: #52b788;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }

  /* ── HEADER ── */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 52px 16px 12px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 10; }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header h1 span { color: var(--accent2); }
  .stats-row { display: flex; gap: 12px; }
  .stat-chip { font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; color: var(--text2); }
  .stat-chip b { color: var(--text); }

  /* ── TABS ── */
  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 11px 8px; font-size: 13px; font-weight: 600; color: var(--text3); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  /* ── SEARCH + FILTERS ── */
  .search-bar { padding: 10px 14px 6px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .search-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 14px; font-size: 15px; color: var(--text); outline: none; }
  .search-input::placeholder { color: var(--text3); }
  .filter-scroll { display: flex; gap: 7px; overflow-x: auto; padding: 8px 14px 10px; background: var(--surface); border-bottom: 1px solid var(--border); scrollbar-width: none; }
  .filter-scroll::-webkit-scrollbar { display: none; }
  .filter-pill { flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 5px 13px; border-radius: 20px; border: 1.5px solid var(--border); color: var(--text2); background: transparent; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
  .filter-pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-pill.pr-on { background: var(--coral); border-color: var(--coral); color: #fff; }
  .filter-pill.new-on { background: var(--green); border-color: var(--green); color: #000; }
  .filter-pill.babbel-on { background: var(--babbel); border-color: var(--babbel); color: #fff; }
  .filter-pill.podcast-on { background: var(--podcast); border-color: var(--podcast); color: #fff; }

  /* ── SPEED ROW ── */
  .speed-row { display: flex; align-items: center; gap: 8px; padding: 6px 14px 8px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text2); }
  .speed-btn { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; border: 1.5px solid var(--border); color: var(--text2); background: transparent; cursor: pointer; }
  .speed-btn.on { border-color: var(--accent2); color: var(--accent2); }

  /* ── LIST ── */
  .list-wrap { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .list-showing { font-size: 11px; color: var(--text3); padding: 8px 14px 4px; }
  .vocab-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--border); position: relative; }
  .vocab-card.pr { border-left: 3px solid var(--coral); }
  .vocab-card.nw { border-left: 3px solid var(--green); }
  .card-body { flex: 1; min-width: 0; }
  .card-sv { font-size: 16px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .card-pron { font-size: 12px; color: var(--accent2); font-style: italic; margin-top: 2px; }
  .card-en { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .card-meta { display: flex; gap: 6px; margin-top: 5px; align-items: center; flex-wrap: wrap; }
  .src-tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .src-babbel { background: rgba(74,159,212,0.15); color: var(--babbel); }
  .src-podcast { background: rgba(82,183,136,0.15); color: var(--podcast); }
  .cat-tag { font-size: 10px; color: var(--text3); }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; }
  .badge-pr { background: rgba(224,112,96,0.15); color: var(--coral); }
  .badge-new { background: rgba(52,201,136,0.15); color: var(--green); }
  .speak-btn { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--surface2); border: 1.5px solid var(--border); color: var(--text2); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .speak-btn.playing { background: var(--accent); border-color: var(--accent); color: #fff; }
  .speak-btn:active { transform: scale(0.9); }
  .empty { padding: 60px 24px; text-align: center; color: var(--text3); font-size: 15px; }

  /* ── QUIZ ── */
  .quiz-wrap { flex: 1; overflow-y: auto; padding: 20px 16px 100px; }
  .quiz-progress { display: flex; gap: 3px; margin-bottom: 20px; }
  .quiz-pip { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
  .quiz-pip.done { background: var(--green); }
  .quiz-pip.current { background: var(--accent2); }
  .quiz-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 16px; }
  .quiz-q-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 8px; }
  .quiz-q { font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
  .quiz-hint { font-size: 12px; color: var(--text3); }
  .quiz-input { width: 100%; background: var(--surface2); border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 18px; color: var(--text); outline: none; margin-top: 16px; transition: border-color 0.15s; }
  .quiz-input:focus { border-color: var(--accent); }
  .quiz-input.correct { border-color: var(--green); background: rgba(52,201,136,0.08); }
  .quiz-input.wrong { border-color: var(--coral); background: rgba(224,112,96,0.08); }
  .quiz-feedback { margin-top: 12px; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 14px; display: none; }
  .quiz-feedback.correct { background: rgba(52,201,136,0.12); color: var(--green); display: block; }
  .quiz-feedback.wrong { background: rgba(224,112,96,0.12); color: var(--coral); display: block; }
  .quiz-actions { display: flex; gap: 10px; margin-top: 14px; }
  .quiz-btn { flex: 1; padding: 14px; border-radius: var(--radius-sm); border: none; font-size: 15px; font-weight: 700; cursor: pointer; }
  .quiz-btn.check { background: var(--accent); color: #fff; }
  .quiz-btn.next { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
  .quiz-btn.speak { background: transparent; border: 1.5px solid var(--border); color: var(--text2); flex: 0 0 auto; padding: 14px 18px; }
  .quiz-score { text-align: center; padding: 40px 20px; }
  .score-num { font-size: 64px; font-weight: 800; color: var(--accent2); line-height: 1; }
  .score-label { font-size: 16px; color: var(--text2); margin-top: 8px; }
  .score-sub { font-size: 13px; color: var(--text3); margin-top: 4px; }
  .restart-btn { margin-top: 28px; display: inline-block; background: var(--accent); color: #fff; padding: 14px 32px; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; cursor: pointer; border: none; }

  /* ── LAYOUT ── */
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ── BOTTOM NAV ── */
  .bottom-nav { display: flex; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; background: none; border: none; cursor: pointer; color: var(--text3); font-size: 10px; font-weight: 600; transition: color 0.15s; }
  .nav-btn.active { color: var(--accent2); }
  .nav-icon { font-size: 22px; }
</style>
</head>
<body>

<!-- ── BROWSE SCREEN ── -->
<div id="screen-browse" class="screen active">
  <div class="header">
    <div>
      <h1>🇸🇪 <span>Svenska</span></h1>
    </div>
    <div class="stats-row">
      <div class="stat-chip"><b id="stat-total">0</b> words</div>
      <div class="stat-chip" style="color:var(--coral)"><b id="stat-pr">0</b> review</div>
    </div>
  </div>
  <div class="search-bar">
    <input class="search-input" type="search" placeholder="Search Swedish or English..." oninput="doSearch(this.value)" id="search-in">
  </div>
  <div class="filter-scroll" id="src-filters">
    <button class="filter-pill babbel-on" onclick="setSrc('all',this)">All sources</button>
    <button class="filter-pill" onclick="setSrc('Babbel',this)">Babbel</button>
    <button class="filter-pill" onclick="setSrc('Podcast',this)">Podcast PDF</button>
  </div>
  <div class="filter-scroll" id="cat-filters">
    <button class="filter-pill on" onclick="setCat('all',this)">All</button>
    <button class="filter-pill pr-on" onclick="setCat('priority',this)">⚑ Review</button>
    <button class="filter-pill new-on" onclick="setCat('new',this)">✦ New</button>
    <button class="filter-pill" onclick="setCat('Greetings',this)">Greetings</button>
    <button class="filter-pill" onclick="setCat('Family',this)">Family</button>
    <button class="filter-pill" onclick="setCat('People',this)">People</button>
    <button class="filter-pill" onclick="setCat('Daily life',this)">Daily life</button>
    <button class="filter-pill" onclick="setCat('Weather',this)">Weather</button>
    <button class="filter-pill" onclick="setCat('Restaurant',this)">Restaurant</button>
    <button class="filter-pill" onclick="setCat('Questions',this)">Questions</button>
    <button class="filter-pill" onclick="setCat('Directions',this)">Directions</button>
    <button class="filter-pill" onclick="setCat('Transport',this)">Transport</button>
    <button class="filter-pill" onclick="setCat('Social',this)">Social</button>
    <button class="filter-pill" onclick="setCat('Pronouns',this)">Pronouns</button>
    <button class="filter-pill" onclick="setCat('Pronunciation',this)">Pronunciation</button>
  </div>
  <div class="speed-row">
    🔊 Speed:
    <button class="speed-btn" onclick="setSpeed(0.6,this)">Slow</button>
    <button class="speed-btn on" onclick="setSpeed(0.85,this)">Normal</button>
    <button class="speed-btn" onclick="setSpeed(1.1,this)">Fast</button>
    <span id="voice-label" style="margin-left:4px;font-size:11px;color:var(--text3)">loading voice...</span>
  </div>
  <div class="list-wrap" id="list-wrap">
    <div class="list-showing" id="list-showing"></div>
    <div id="list"></div>
  </div>
</div>

<!-- ── QUIZ SCREEN ── -->
<div id="screen-quiz" class="screen">
  <div class="header">
    <h1>🎯 <span>Quiz</span></h1>
    <div class="stats-row">
      <div class="stat-chip"><b id="q-score">0</b> correct</div>
      <div class="stat-chip"><b id="q-of">0</b> left</div>
    </div>
  </div>
  <div class="filter-scroll" style="background:var(--surface);border-bottom:1px solid var(--border)">
    <button class="filter-pill on" onclick="setQuizMode('priority',this)">⚑ Review words</button>
    <button class="filter-pill" onclick="setQuizMode('new',this)">✦ New words</button>
    <button class="filter-pill" onclick="setQuizMode('all',this)">All words</button>
  </div>
  <div class="quiz-wrap" id="quiz-wrap"></div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-browse" onclick="showScreen('browse')">
    <span class="nav-icon">📚</span>Browse
  </button>
  <button class="nav-btn" id="nav-quiz" onclick="showScreen('quiz')">
    <span class="nav-icon">🎯</span>Quiz
  </button>
</nav>

// ── STATE ──
let catF='all', srcF='all', searchQ='', svVoice=null, curBtn=null, rate=0.85;
let quizItems=[], quizIdx=0, quizScore=0, quizMode='priority', answered=false;

// ── VOICE ──
function loadVoice(){
  const vv=window.speechSynthesis.getVoices();
  svVoice=vv.find(v=>v.lang.startsWith('sv'))||null;
  document.getElementById('voice-label').textContent=svVoice?'('+svVoice.name+')':'(no Swedish voice — try Chrome)';
}
if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=loadVoice;loadVoice();}

function speak(text,btn){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  if(curBtn&&curBtn!==btn){curBtn.classList.remove('playing');curBtn.textContent='🔊';}
  const u=new SpeechSynthesisUtterance(text);
  if(svVoice)u.voice=svVoice;
  u.lang='sv-SE';u.rate=rate;
  btn.classList.add('playing');btn.textContent='⏸';
  curBtn=btn;
  u.onend=()=>{btn.classList.remove('playing');btn.textContent='🔊';curBtn=null;};
  window.speechSynthesis.speak(u);
}

function setSpeed(r,btn){
  rate=r;
  document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

// ── BROWSE ──
function filtered(){
  let items=VOCAB;
  if(catF==='priority') items=items.filter(v=>v.p);
  else if(catF==='new') items=items.filter(v=>v.n);
  else if(catF!=='all') items=items.filter(v=>v.cat===catF);
  if(srcF!=='all') items=items.filter(v=>v.src===srcF);
  if(searchQ){const q=searchQ.toLowerCase();items=items.filter(v=>v.sv.toLowerCase().includes(q)||v.en.toLowerCase().includes(q));}
  return items;
}

function renderList(){
  const items=filtered();
  document.getElementById('list-showing').textContent=`Showing ${items.length} of ${VOCAB.length} entries`;
  const list=document.getElementById('list');
  list.innerHTML='';
  if(!items.length){list.innerHTML='<div class="empty">No entries found</div>';return;}
  items.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='vocab-card'+(v.p?' pr':v.n?' nw':'');
    const badge=v.p?'<span class="badge badge-pr">review</span>':v.n?'<span class="badge badge-new">new</span>':'';
    const srcCls=v.src==='Babbel'?'src-babbel':'src-podcast';
    d.innerHTML=`<div class="card-body"><div class="card-sv">${v.sv} ${badge}</div><div class="card-pron">${v.pron}</div><div class="card-en">${v.en}</div><div class="card-meta"><span class="src-tag ${srcCls}">${v.src}</span><span class="cat-tag">${v.cat}</span></div></div><button class="speak-btn" onclick="speak('${v.sv.replace(/'/g,"\\'")}',this)">🔊</button>`;
    list.appendChild(d);
  });
}

function setCat(f,btn){
  catF=f;
  document.querySelectorAll('#cat-filters .filter-pill').forEach(b=>b.classList.remove('on','pr-on','new-on'));
  btn.classList.add(f==='priority'?'pr-on':f==='new'?'new-on':'on');
  renderList();
}

function setSrc(f,btn){
  srcF=f;
  document.querySelectorAll('#src-filters .filter-pill').forEach(b=>b.classList.remove('babbel-on','podcast-on'));
  btn.classList.add(f==='Podcast'?'podcast-on':'babbel-on');
  renderList();
}

function doSearch(q){searchQ=q;renderList();}

// ── QUIZ ──
function setQuizMode(mode,btn){
  quizMode=mode;
  document.querySelectorAll('#screen-quiz .filter-scroll .filter-pill').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  startQuiz();
}

function startQuiz(){
  let pool=VOCAB;
  if(quizMode==='priority') pool=VOCAB.filter(v=>v.p);
  else if(quizMode==='new') pool=VOCAB.filter(v=>v.n);
  quizItems=[...pool].sort(()=>Math.random()-0.5);
  quizIdx=0; quizScore=0;
  renderQuiz();
}

function renderQuiz(){
  updateQStats();
  const wrap=document.getElementById('quiz-wrap');
  if(quizIdx>=quizItems.length){
    const pct=Math.round(quizScore/quizItems.length*100);
    wrap.innerHTML=`<div class="quiz-score"><div class="score-num">${pct}%</div><div class="score-label">${quizScore} of ${quizItems.length} correct</div><div class="score-sub">${pct>=80?'Excellent! 🎉':pct>=60?'Good work! 💪':'Keep practising! 📚'}</div><button class="restart-btn" onclick="startQuiz()">Try again</button></div>`;
    return;
  }
  const v=quizItems[quizIdx];
  answered=false;
  const pips=quizItems.map((_,i)=>`<div class="quiz-pip${i<quizIdx?' done':i===quizIdx?' current':''}"></div>`).join('');
  wrap.innerHTML=`<div class="quiz-progress">${pips}</div>
  <div class="quiz-card">
    <div class="quiz-q-label">Translate to Swedish</div>
    <div class="quiz-q">${v.en}</div>
    <div class="quiz-hint">Category: ${v.cat} · ${v.src}</div>
    <input class="quiz-input" id="quiz-in" type="text" placeholder="Type in Swedish..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkAnswer()">
    <div class="quiz-feedback" id="quiz-fb"></div>
  </div>
  <div class="quiz-actions">
    <button class="quiz-btn check" onclick="checkAnswer()">Check</button>
    <button class="quiz-btn next" onclick="nextQ()">Skip →</button>
    <button class="quiz-btn speak" onclick="speakCurrent()">🔊</button>
  </div>`;
  setTimeout(()=>{ const el=document.getElementById('quiz-in'); if(el) el.focus(); },100);
}

function checkAnswer(){
  if(answered)return;
  const v=quizItems[quizIdx];
  const inp=document.getElementById('quiz-in');
  const fb=document.getElementById('quiz-fb');
  const raw=inp.value.trim();
  if(!raw)return;
  answered=true;
  const norm=s=>s.toLowerCase().replace(/[!?.]/g,'').trim();
  const correct=norm(raw)===norm(v.sv);
  inp.classList.add(correct?'correct':'wrong');
  if(correct){
    quizScore++;
    fb.className='quiz-feedback correct';
    fb.textContent='✓ Correct!';
  } else {
    fb.className='quiz-feedback wrong';
    fb.innerHTML=`✗ Answer: <strong>${v.sv}</strong> · ${v.pron}`;
  }
  updateQStats();
}

function nextQ(){quizIdx++;renderQuiz();}

function speakCurrent(){
  if(quizIdx<quizItems.length){
    const v=quizItems[quizIdx];
    const dummy=document.createElement('button');
    speak(v.sv,dummy);
  }
}

function updateQStats(){
  document.getElementById('q-score').textContent=quizScore;
  document.getElementById('q-of').textContent=Math.max(0,quizItems.length-quizIdx);
}

// ── NAV ──
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='quiz'&&quizItems.length===0) startQuiz();
}

// ── INIT ──
document.getElementById('stat-total').textContent=VOCAB.length;
document.getElementById('stat-pr').textContent=VOCAB.filter(v=>v.p).length;
renderList();
</script>
</body>
